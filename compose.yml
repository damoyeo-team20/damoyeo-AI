services:
  ai:
    build: .
    image: ${AI_IMAGE:-damoyeo-ai:local}
    container_name: damoyeo-ai
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?GOOGLE_API_KEY를 .env에 설정하세요}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:?KAKAO_REST_API_KEY를 .env에 설정하세요}
      # Back은 이제 이 compose 밖(백엔드 팀이 별도로 배포, 실제 RDS 연결)에서 돈다.
      # 로컬 개발 중이면 http://localhost:8080, 배포 환경이면 실제 Back 주소를 .env에 넣는다.
      BACKEND_API_BASE_URL: ${BACKEND_API_BASE_URL:?BACKEND_API_BASE_URL을 .env에 설정하세요}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-ai-key}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-damoyeo-ai}
      # TODO: 임시. N6 영업 검증(Gemini google_search)이 할당량 문제로 테스트를 막아서 우회용.
      SKIP_BUSINESS_HOURS_VERIFICATION: ${SKIP_BUSINESS_HOURS_VERIFICATION:-false}
    # Back이 더 이상 이 compose가 관리하는 서비스가 아니라, 같은 호스트에 떠 있는 컨테이너를
    # host.docker.internal로 부른다. 백엔드 팀이 별도 서버로 옮기면 BACKEND_API_BASE_URL만
    # 바꾸면 되고 이 설정은 지워도 된다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # TODO: 임시로 전체 공개 — 원래는 127.0.0.1로만 바인딩해서 Back만 접근하게 해야 한다.
      # 잠깐 쓰고 정리할 예정이라 되돌려둠 (2026-08-20, 호찬 요청).
      - "${AI_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 1m
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
